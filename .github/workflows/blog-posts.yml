# Pull the five most recent posts from an RSS feed into the README.
#
# No feed is configured yet: BLOG_FEED_URLS is empty, so this workflow exits
# cleanly instead of writing an empty list over the placeholder. Set the
# repository variable BLOG_FEED_URLS (Settings > Secrets and variables >
# Actions > Variables) to switch it on. See SETUP.md section 5.
name: blog-posts

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  posts:
    name: sync latest writing
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        # verify_readme.py is stdlib-only, so no dependency install is needed.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check for a configured feed
        id: gate
        env:
          FEEDS: ${{ vars.BLOG_FEED_URLS }}
        run: |
          if [ -z "$FEEDS" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BLOG_FEED_URLS is not set; leaving the placeholder in place."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync posts into the README
        if: steps.gate.outputs.enabled == 'true'
        uses: gautamkrishnar/blog-post-workflow@2786e54a01b71aec80a5118c2bd6b5044e842597 # 1.9.6
        with:
          feed_list: ${{ vars.BLOG_FEED_URLS }}
          max_post_count: 5
          comment_tag_name: BLOG-POST-LIST
          template: "- [$title]($url) &middot; <sub>$newline$date</sub>$newline"
          date_format: "mmm d, yyyy"
          commit_message: "blog: sync latest posts"
          committer_username: github-actions[bot]
          committer_email: github-actions[bot]@users.noreply.github.com

      - name: Verify the README still renders safely
        if: steps.gate.outputs.enabled == 'true'
        run: python scripts/verify_readme.py --assets assets
