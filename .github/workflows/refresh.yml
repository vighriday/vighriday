name: Refresh public activity

on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'fonts/**'
      - 'package*.json'
      - '.node-version'
      - '.github/workflows/refresh.yml'

permissions:
  contents: read

concurrency:
  group: public-activity-writer
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Fetch and validate the public calendar
        run: npm run refresh
      - run: npm run verify
      - name: Publish both files in one commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-activity.mjs
