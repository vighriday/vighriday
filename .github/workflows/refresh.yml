name: Refresh profile signal and cache assets

on:
  schedule:
    - cron: "53 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.6.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: "3.12"
      - name: Regenerate timestamped profile signal
        run: |
          mkdir -p dist
          QUOTE="$(curl --fail --silent --show-error 'https://v2.jokeapi.dev/joke/Programming?type=single&safe-mode' | jq -r '.joke // empty' || true)"
          if [ -z "$QUOTE" ]; then QUOTE="Verification turns shipping into engineering."; fi
          python scripts/build_assets.py --output-dir dist --timestamp "$(date -u '+%Y-%m-%d %H:%M UTC')" --quote "$QUOTE"
      - name: Calculate public-repository star total for Shields
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STARS="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/users/vighriday/repos?per_page=100" | jq '[.[].stargazers_count] | add // 0')"
          printf '{"schemaVersion":1,"label":"TOTAL STARS","message":"%s","color":"7C5CFC"}\n' "$STARS" > dist/stars.json
      - name: Publish refreshed assets to output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_output_branch.sh ./dist "chore: refresh profile signal"
