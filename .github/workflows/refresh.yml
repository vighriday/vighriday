# The heartbeat. Regenerates every self-hosted asset and publishes it, so the
# oscilloscope, commit clock, language bars, quote card, stars badge and the
# "last refreshed" strip all stay current.
#
# If this workflow is green and the timestamp on the profile is stale, the
# problem is Camo caching, not the pipeline. See SETUP.md, "Camo".
name: refresh

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/theme.py"
      - "scripts/build_assets.py"
      - "scripts/gh_charts.py"

permissions:
  contents: write

concurrency:
  group: profile-output-branch
  cancel-in-progress: false

jobs:
  refresh:
    name: rebuild self-hosted assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Rebuild themed assets
        run: |
          python scripts/build_assets.py \
            --timestamp "$(date -u '+%Y-%m-%d %H:%M UTC')" \
            --quote "$(python scripts/quote.py)"

      - name: Rebuild GitHub-derived charts
        env:
          # Prefer a PAT if one exists: the contributions calendar lives behind
          # GraphQL, which the default token is not always allowed to read.
          GH_CHART_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/gh_charts.py

      - name: Verify before publishing
        # Never publish an asset that would fail the README's own test suite.
        run: python scripts/verify_readme.py

      - name: Commit refreshed assets to main
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "refresh: rebuild self-hosted assets"
          file_pattern: assets/*.svg assets/*.json
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

      - name: Stage assets for the output branch
        run: |
          mkdir -p dist
          cp assets/oscilloscope.svg assets/commit-clock.svg assets/language-bars.svg dist/
          cp assets/quote-card.svg assets/profile-signal.svg dist/
          cp assets/stars.json assets/pulse.json dist/

      - name: Seed placeholders for assets other workflows have not published yet
        # A <picture> does NOT fall back to its <img> when a <source> fails to
        # load - only when no <source> matches. So a dark-mode source pointing at
        # a file that does not exist yet renders nothing at all, rather than the
        # fallback. Seeding the names on first run keeps the profile whole before
        # snake/pacman/3d-contrib/metrics have ever run.
        #
        # Idempotent: anything already on the branch is left exactly as it is.
        run: |
          git fetch origin output --depth=1 || echo "output branch does not exist yet"
          published=""
          if git rev-parse --verify origin/output >/dev/null 2>&1; then
            published=$(git ls-tree -r origin/output --name-only)
          fi

          seed() {
            if printf '%s\n' "$published" | grep -qx "$1"; then
              echo "keep    $1 (already published)"
            else
              cp "$2" "dist/$1"
              echo "seed    $1"
            fi
          }

          seed snake-light.svg     assets/snake-placeholder.svg
          seed snake-dark.svg      assets/snake-placeholder.svg
          seed pacman-light.svg    assets/dynamic-placeholder.svg
          seed pacman-dark.svg     assets/dynamic-placeholder.svg
          seed contrib-3d-light.svg assets/dynamic-placeholder.svg
          seed contrib-3d-dark.svg  assets/dynamic-placeholder.svg
          seed metrics-light.svg   assets/metrics-placeholder.svg
          seed metrics-dark.svg    assets/metrics-placeholder.svg

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          keep_files: true
          commit_message: "refresh: publish self-hosted assets"
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
