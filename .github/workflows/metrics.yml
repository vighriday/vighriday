# lowlighter/metrics - the mega-dashboard, rendered twice so <picture> has a
# real asset for each GitHub theme.
#
# Requires METRICS_TOKEN: a classic PAT with `public_repo` and `read:user`.
# The default GITHUB_TOKEN cannot read the data most of these plugins need.
# Without the secret this workflow no-ops instead of failing - the README keeps
# showing assets/metrics-placeholder.svg and nothing looks broken.
name: metrics

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-output-branch
  cancel-in-progress: false

jobs:
  metrics:
    name: render dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        # Required. Without a checked-out repository the publish action finds no
        # git worktree, decides this is a "first deployment", and then dies on
        # `git checkout --orphan output` because that branch already exists.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for the metrics token
        id: gate
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::METRICS_TOKEN is not set; skipping. See SETUP.md section 3."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the output directory
        # metrics writes to `filename` without creating parent directories, and
        # swallows the resulting write error, so the render step reports success
        # having produced nothing.
        if: steps.gate.outputs.enabled == 'true'
        run: mkdir -p dist

      - name: Render dark dashboard
        if: steps.gate.outputs.enabled == 'true'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: dist/metrics-dark.svg
          output_action: none
          config_timezone: Asia/Kolkata
          config_output: svg
          base: header, activity, community, repositories, metadata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
          plugin_habits_facts: yes
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_display: compact
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          # Metrics ships light/dark themes rather than colour parameters, so
          # the palette is imposed with extras_css instead. This is the only
          # third-party card on the page that needs that treatment.
          extras_css: |
            svg { --color-text: #FFE9BE; --color-title: #FFB000; --color-subtitle: #B8925A; }
            .background, svg > rect:first-of-type { fill: #0B0906; }
            h1, h2, .title { fill: #FFB000 !important; color: #FFB000 !important; }
            text, .field, tspan { fill: #FFE9BE; }
            .calendar-graph-day-L1 { fill: #3A2C12; }
            .calendar-graph-day-L2 { fill: #7A5A1E; }
            .calendar-graph-day-L3 { fill: #FF8A00; }
            .calendar-graph-day-L4 { fill: #FFB000; }

      - name: Render light dashboard
        if: steps.gate.outputs.enabled == 'true'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: dist/metrics-light.svg
          output_action: none
          config_timezone: Asia/Kolkata
          config_output: svg
          base: header, activity, community, repositories, metadata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
          plugin_habits_facts: yes
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_display: compact
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          extras_css: |
            svg { --color-text: #241802; --color-title: #FF8A00; --color-subtitle: #7A5A1E; }
            .background, svg > rect:first-of-type { fill: #FFFBF2; }
            h1, h2, .title { fill: #FF8A00 !important; color: #FF8A00 !important; }
            text, .field, tspan { fill: #241802; }
            .calendar-graph-day-L1 { fill: #F0DFBE; }
            .calendar-graph-day-L2 { fill: #FFD37A; }
            .calendar-graph-day-L3 { fill: #FFB000; }
            .calendar-graph-day-L4 { fill: #FF8A00; }

      - name: Confirm both dashboards were actually written
        # The render steps report success even when they produce no file, which
        # previously let a broken run publish an empty directory and look green.
        if: steps.gate.outputs.enabled == 'true'
        run: |
          echo "--- SVGs in the workspace ---"
          find . -name '*.svg' -not -path './.git/*' -newermt '-15 minutes' -print

          # Recover if metrics wrote somewhere other than the requested path.
          for pair in "dark" "light"; do
            target="dist/metrics-$pair.svg"
            if [ ! -s "$target" ]; then
              found=$(find . -name "*metrics*$pair*.svg" -not -path './.git/*' -not -path "./$target" | head -1)
              [ -n "$found" ] && cp "$found" "$target" && echo "recovered $target <- $found"
            fi
          done

          missing=0
          for f in dist/metrics-dark.svg dist/metrics-light.svg; do
            if [ ! -s "$f" ]; then
              echo "::error::$f was not produced by the metrics render step."
              missing=1
            else
              echo "ok  $f  $(stat -c%s "$f") bytes"
            fi
          done
          exit $missing

      - name: Publish to output branch
        if: steps.gate.outputs.enabled == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          keep_files: true
          commit_message: "metrics: refresh dashboard"
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
