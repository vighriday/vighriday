name: Generate 3D contribution graph

on:
  schedule:
    - cron: "43 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.6.0
      - name: Render contribution calendar in 3D
        uses: yoshi389111/github-profile-3d-contrib@9e3f937195cf840d364388973f73e3c4b3753586 # latest at 2026-08-01
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: vighriday
      - name: Stage light and dark 3D views
        run: |
          mkdir -p dist
          cp profile-3d-contrib/profile-green-animate.svg dist/contrib-3d-light.svg
          cp profile-3d-contrib/profile-night-view.svg dist/contrib-3d-dark.svg
      - name: Publish generated SVGs to output
        uses: peaceiris/actions-gh-pages@09d8f313dcc84179c9f28dbbbe1f06f3ca174008 # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          keep_files: true
          commit_message: "chore: refresh 3d contribution graph"
