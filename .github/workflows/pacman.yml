# Pac-Man contribution graph. Kept inside a <details> in the README so the page
# is not two full-width games stacked on top of each other.
name: pacman

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-output-branch
  cancel-in-progress: false

jobs:
  pacman:
    name: generate and publish
    runs-on: ubuntu-latest
    steps:
      - name: Generate Pac-Man graph
        # Note: unlike Platane/snk, this action has no `outputs` input. Its only
        # inputs are github_user_name, github_token, games, player_style and
        # hide_month_labels; anything else is silently ignored. It writes its own
        # filenames into the workspace, so the next step normalises them.
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa # v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman
          player_style: opportunistic

      - name: Normalise output filenames
        # Discover whatever the action produced rather than assuming a name, so
        # an upstream rename degrades to a clear error instead of a silent
        # "success" that publishes nothing.
        run: |
          echo "--- SVGs produced ---"
          find . -name '*.svg' -not -path './.git/*' -newermt '-10 minutes' -print

          mkdir -p dist
          # The action happens to write into dist/ already, so search everywhere
          # and exclude only the normalised target names - excluding dist/ itself
          # would skip the very files being looked for.
          dark=$(find . -name '*pacman*dark*.svg' -not -path './.git/*' ! -name 'pacman-dark.svg' | head -1)
          light=$(find . -name '*pacman*.svg' -not -path './.git/*' ! -name '*dark*' ! -name 'pacman-light.svg' | head -1)

          if [ -z "$dark" ] && [ -z "$light" ]; then
            echo "::error::The Pac-Man action produced no SVG. Its output filenames may have changed upstream."
            exit 1
          fi
          # Fall back to whichever variant exists so one missing theme does not
          # leave a dead <picture> source on the profile.
          [ -n "$dark" ]  || dark="$light"
          [ -n "$light" ] || light="$dark"

          cp "$dark"  dist/pacman-dark.svg
          cp "$light" dist/pacman-light.svg
          echo "dark  <- $dark"
          echo "light <- $light"
          ls -la dist

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          keep_files: true
          commit_message: "pacman: refresh contribution graph"
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
