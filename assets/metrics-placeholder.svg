<svg xmlns="http://www.w3.org/2000/svg" width="830" height="300" viewBox="0 0 830 300" role="img" aria-labelledby="pt pd"><title id="pt">Metrics dashboard pending</title><desc id="pd">metrics.yml needs METRICS_TOKEN before its first run. See SETUP.md.</desc><defs><pattern id="pscan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="var(--scanInk)" opacity="var(--scanOp)"/></pattern><radialGradient id="pvig" cx="50%" cy="50%" r="75%"><stop offset="52%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="var(--vig)"/></radialGradient><linearGradient id="pglowline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--accent)" stop-opacity="0"/><stop offset="50%" stop-color="var(--accent)" stop-opacity="1"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><style>:root{--bg:#FFFBF2;--surface:#FFF6E6;--ink:#241802;--muted:#7A5A1E;--grid:#F0DFBE;--accent:#FF8A00;--glow:#FFB000;--scanInk:#7A5A1E;--scanOp:.06;--vig:.08;}@media(prefers-color-scheme:dark){:root{--bg:#0B0906;--surface:#14100A;--ink:#FFE9BE;--muted:#B8925A;--grid:#3A2C12;--accent:#FFB000;--glow:#FFD37A;--scanInk:#000000;--scanOp:.30;--vig:.42;}}.dash{stroke:var(--grid);stroke-width:1;stroke-dasharray:5 8;fill:none;animation:dash 14s linear infinite}@keyframes dash{to{stroke-dashoffset:-130}}.hl{fill:var(--ink);font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:15px;font-weight:700;letter-spacing:2.4px}.nt{fill:var(--muted);font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:11px;letter-spacing:.6px}.dot{animation:blink 1.6s steps(2,end) infinite}@keyframes blink{50%{opacity:.2}}</style><rect width="830" height="300" rx="14" fill="var(--bg)"/><rect class="dash" x="14" y="14" width="802" height="272" rx="10"/><circle class="dot" cx="297" cy="144" r="4" fill="var(--accent)"/><text class="hl" x="415" y="150" text-anchor="middle">METRICS DASHBOARD PENDING</text><text class="nt" x="415" y="174" text-anchor="middle">metrics.yml needs METRICS_TOKEN before its first run. See SETUP.md.</text><rect width="830" height="300" rx="14" fill="url(#pscan)"/></svg>
