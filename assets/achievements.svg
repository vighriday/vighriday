<svg xmlns="http://www.w3.org/2000/svg" width="830" height="132" viewBox="0 0 830 132" role="img" aria-labelledby="at ad"><title id="at">Profile achievements</title><desc id="ad">Achievement tiles computed from live GitHub API data.</desc><style>:root{--bg:#FFFBF2;--surface:#FFF6E6;--ink:#241802;--muted:#7A5A1E;--grid:#F0DFBE;--accent:#FF8A00;--glow:#FFB000;--scanInk:#7A5A1E;--scanOp:.06;--vig:.08;}@media(prefers-color-scheme:dark){:root{--bg:#0B0906;--surface:#14100A;--ink:#FFE9BE;--muted:#B8925A;--grid:#3A2C12;--accent:#FFB000;--glow:#FFD37A;--scanInk:#000000;--scanOp:.26;--vig:.38;}}.hd{fill:var(--muted);font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:9px;letter-spacing:2px}.tv{fill:var(--accent);font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:13px;font-weight:700}.tl{fill:var(--muted);font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:8px;letter-spacing:1.1px}.halo{animation:halo 3.6s ease-in-out infinite}.h0{animation-delay:0.00s}.h1{animation-delay:0.22s}.h2{animation-delay:0.44s}.h3{animation-delay:0.66s}.h4{animation-delay:0.88s}@keyframes halo{0%,100%{opacity:.35;r:13}50%{opacity:1;r:15}}</style><rect width="830" height="132" rx="14" fill="var(--bg)" stroke="var(--grid)"/><text class="hd" x="18" y="24">ACHIEVEMENTS</text><rect x="18.0" y="34" width="104.9" height="82" rx="10" fill="var(--surface)" stroke="var(--grid)"/><circle class="halo h0" cx="70.4" cy="60" r="13" fill="none" stroke="var(--accent)" stroke-width="1.5"/><text class="tv" x="70.4" y="65" text-anchor="middle">1</text><text class="tl" x="70.4" y="98" text-anchor="middle">STARS EARNED</text><rect x="132.9" y="34" width="104.9" height="82" rx="10" fill="var(--surface)" stroke="var(--grid)"/><circle class="halo h1" cx="185.3" cy="60" r="13" fill="none" stroke="var(--accent)" stroke-width="1.5"/><text class="tv" x="185.3" y="65" text-anchor="middle">20</text><text class="tl" x="185.3" y="98" text-anchor="middle">PUBLIC REPOS</text><rect x="247.7" y="34" width="104.9" height="82" rx="10" fill="var(--surface)" stroke="var(--grid)"/><circle class="halo h2" cx="300.1" cy="60" r="13" fill="none" stroke="var(--accent)" stroke-width="1.5"/><text class="tv" x="300.1" y="65" text-anchor="middle">6</text><text class="tl" x="300.1" y="98" text-anchor="middle">LANGUAGES</text><rect x="362.6" y="34" width="104.9" height="82" rx="10" fill="var(--surface)" stroke="var(--grid)"/><circle class="halo h3" cx="415.0" cy="60" r="13" fill="none" stroke="var(--accent)" stroke-width="1.5"/><text class="tv" x="415.0" y="65" text-anchor="middle">2</text><text class="tl" x="415.0" y="98" text-anchor="middle">FOLLOWERS</text><rect x="477.4" y="34" width="104.9" height="82" rx="10" fill="var(--surface)" stroke="var(--grid)"/><circle class="halo h4" cx="529.9" cy="60" r="13" fill="none" stroke="var(--accent)" stroke-width="1.5"/><text class="tv" x="529.9" y="65" text-anchor="middle">5</text><text class="tl" x="529.9" y="98" text-anchor="middle">PULL REQUESTS</text><rect x="592.3" y="34" width="104.9" height="82" rx="10" fill="var(--surface)" stroke="var(--grid)"/><circle class="halo h0" cx="644.7" cy="60" r="13" fill="none" stroke="var(--accent)" stroke-width="1.5"/><text class="tv" x="644.7" y="65" text-anchor="middle">2397</text><text class="tl" x="644.7" y="98" text-anchor="middle">CONTRIBUTIONS</text><rect x="707.1" y="34" width="104.9" height="82" rx="10" fill="var(--surface)" stroke="var(--grid)"/><circle class="halo h1" cx="759.6" cy="60" r="13" fill="none" stroke="var(--accent)" stroke-width="1.5"/><text class="tv" x="759.6" y="65" text-anchor="middle">npm</text><text class="tl" x="759.6" y="98" text-anchor="middle">PUBLISHED</text></svg>
