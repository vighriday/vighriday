<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img" aria-labelledby="t d">
<title id="t">Hriday Vig - software engineer and AI systems builder</title><desc id="d">Indigo animated fallback hero banner.</desc>
<style>
:root { --bg:#f9f7ff; --ink:#21174A; --muted:#675E87; --accent:#7C5CFC; }
@media(prefers-color-scheme:dark) { :root { --bg:#0f0b1d; --ink:#EEEAFF; --muted:#BDB4DA; --accent:#A78BFA; } }
.orb { animation: orbit 9s ease-in-out infinite alternate; } .pulse { animation:pulse 3.4s ease-in-out infinite; }
