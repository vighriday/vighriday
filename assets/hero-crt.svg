<svg xmlns="http://www.w3.org/2000/svg" width="830" height="186" viewBox="0 0 830 186" role="img" aria-labelledby="t d"><title id="t">Hriday Vig - profile banner</title><desc id="d">An amber CRT terminal panel that types four rotating lines describing Hriday Vig&#x27;s work, animated with CSS embedded in the SVG.</desc><defs><pattern id="hscan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="var(--scanInk)" opacity="var(--scanOp)"/></pattern><radialGradient id="hvig" cx="50%" cy="50%" r="75%"><stop offset="52%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="var(--vig)"/></radialGradient><linearGradient id="hglowline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--accent)" stop-opacity="0"/><stop offset="50%" stop-color="var(--accent)" stop-opacity="1"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><style>:root{--bg:#FFFBF2;--surface:#FFF6E6;--ink:#241802;--muted:#7A5A1E;--grid:#F0DFBE;--accent:#FF8A00;--glow:#FFB000;--scanInk:#7A5A1E;--scanOp:.06;--vig:.08;}@media(prefers-color-scheme:dark){:root{--bg:#0B0906;--surface:#14100A;--ink:#FFE9BE;--muted:#B8925A;--grid:#3A2C12;--accent:#FFB000;--glow:#FFD37A;--scanInk:#000000;--scanOp:.30;--vig:.42;}}.name{fill:var(--ink);font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:44px;font-weight:800;letter-spacing:-1px}.tag{fill:var(--muted);font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:12px;letter-spacing:3.2px}.line{fill:var(--accent);font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:14px}.sig{fill:var(--muted);font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:10px;letter-spacing:2px}.ps1{fill:var(--muted);font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:14px}.screen{animation:hum 7s ease-in-out infinite}@keyframes hum{0%,100%{opacity:1}46%{opacity:.96}48%{opacity:1}}.led{animation:led 2.4s ease-in-out infinite}@keyframes led{0%,100%{opacity:1}50%{opacity:.25}}.sweep{animation:sweep 7s linear infinite}@keyframes sweep{0%{transform:translateY(0);opacity:0}8%{opacity:.55}92%{opacity:.2}100%{transform:translateY(186px);opacity:0}}@keyframes type0{0%,0.000%{width:0}10.500%{width:453.6px}21.500%{width:453.6px}25.000%{width:0}100%{width:0}}@keyframes caret0{0%,0.000%{transform:translateX(0);opacity:0}0.050%{opacity:1}10.500%{transform:translateX(453.6px);opacity:1}21.500%{transform:translateX(453.6px);opacity:1}25.000%{transform:translateX(0);opacity:0}100%{opacity:0}}.clip0 rect{animation:type0 18.4s steps(54,end) infinite}.caret0{animation:caret0 18.4s steps(54,end) infinite}@keyframes type1{0%,25.000%{width:0}35.500%{width:420.0px}46.500%{width:420.0px}50.000%{width:0}100%{width:0}}@keyframes caret1{0%,25.000%{transform:translateX(0);opacity:0}25.050%{opacity:1}35.500%{transform:translateX(420.0px);opacity:1}46.500%{transform:translateX(420.0px);opacity:1}50.000%{transform:translateX(0);opacity:0}100%{opacity:0}}.clip1 rect{animation:type1 18.4s steps(50,end) infinite}.caret1{animation:caret1 18.4s steps(50,end) infinite}@keyframes type2{0%,50.000%{width:0}60.500%{width:411.6px}71.500%{width:411.6px}75.000%{width:0}100%{width:0}}@keyframes caret2{0%,50.000%{transform:translateX(0);opacity:0}50.050%{opacity:1}60.500%{transform:translateX(411.6px);opacity:1}71.500%{transform:translateX(411.6px);opacity:1}75.000%{transform:translateX(0);opacity:0}100%{opacity:0}}.clip2 rect{animation:type2 18.4s steps(49,end) infinite}.caret2{animation:caret2 18.4s steps(49,end) infinite}@keyframes type3{0%,75.000%{width:0}85.500%{width:478.8px}96.500%{width:478.8px}100.000%{width:0}100%{width:0}}@keyframes caret3{0%,75.000%{transform:translateX(0);opacity:0}75.050%{opacity:1}85.500%{transform:translateX(478.8px);opacity:1}96.500%{transform:translateX(478.8px);opacity:1}100.000%{transform:translateX(0);opacity:0}100%{opacity:0}}.clip3 rect{animation:type3 18.4s steps(57,end) infinite}.caret3{animation:caret3 18.4s steps(57,end) infinite}</style><rect width="830" height="186" rx="16" fill="var(--bg)"/><g class="screen"><text class="name" x="34" y="76">Hriday Vig</text><text class="tag" x="36" y="102">AI PRODUCT MANAGER  ·  GENERATIVE AI  ·  CLOUD NATIVE</text><rect x="34" y="116" width="240" height="2" fill="url(#hglowline)"/><text class="ps1" x="34" y="152">&#187;</text><defs><clipPath id="clip0" class="clip0"><rect x="54" y="138" width="0" height="22"/></clipPath></defs><g clip-path="url(#clip0)"><text class="line" x="54" y="152" textLength="453.6" lengthAdjust="spacing" xml:space="preserve">AI product manager. I scope it, build it, and ship it.</text></g><rect class="caret caret0" x="54" y="140" width="8.4" height="14" fill="var(--accent)"/><defs><clipPath id="clip1" class="clip1"><rect x="54" y="138" width="0" height="22"/></clipPath></defs><g clip-path="url(#clip1)"><text class="line" x="54" y="152" textLength="420.0" lengthAdjust="spacing" xml:space="preserve">Generative AI and agent systems, made accountable.</text></g><rect class="caret caret1" x="54" y="140" width="8.4" height="14" fill="var(--accent)"/><defs><clipPath id="clip2" class="clip2"><rect x="54" y="138" width="0" height="22"/></clipPath></defs><g clip-path="url(#clip2)"><text class="line" x="54" y="152" textLength="411.6" lengthAdjust="spacing" xml:space="preserve">From problem statement to production, end to end.</text></g><rect class="caret caret2" x="54" y="140" width="8.4" height="14" fill="var(--accent)"/><defs><clipPath id="clip3" class="clip3"><rect x="54" y="138" width="0" height="22"/></clipPath></defs><g clip-path="url(#clip3)"><text class="line" x="54" y="152" textLength="478.8" lengthAdjust="spacing" xml:space="preserve">Evidence before prediction. Verification before shipping.</text></g><rect class="caret caret3" x="54" y="140" width="8.4" height="14" fill="var(--accent)"/><g class="sweep"><rect x="0" y="0" width="830" height="1.5" fill="var(--accent)" opacity=".5"/><rect x="0" y="1.5" width="830" height="14" fill="var(--accent)" opacity=".05"/></g><rect width="830" height="186" rx="16" fill="url(#hscan)"/><rect width="830" height="186" rx="16" fill="url(#hvig)"/></g><circle class="led" cx="800" cy="30" r="4" fill="var(--accent)"/><text class="sig" x="786" y="34" text-anchor="end">ONLINE</text><rect width="830" height="186" rx="16" fill="none" stroke="var(--grid)" stroke-width="1"/></svg>
