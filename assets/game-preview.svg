<svg xmlns="http://www.w3.org/2000/svg" width="830" height="330" viewBox="0 0 830 330" role="img" aria-labelledby="title description">
  <title id="title">Play Signal Run, an original game by Hriday Vig</title>
  <desc id="description">A charcoal arcade field with an acid green receiver and a small signal moving toward rows of tiles. Clear the field using keyboard, pointer, or touch controls. Select this image to play.</desc>
  <style>:root{color-scheme:dark}@media(prefers-color-scheme:light){:root{color-scheme:dark}}</style>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e8e7df" stroke-opacity=".045"/></pattern></defs>
  <rect width="830" height="330" fill="#0c0d0b"/>
  <rect x=".5" y=".5" width="829" height="329" fill="url(#grid)" stroke="#e8e7df" stroke-opacity=".2"/>
  <g font-family="ui-monospace,monospace" font-size="10" letter-spacing="1.2" fill="#a6af97"><text x="30" y="33">A SMALL EXPERIMENT / 01</text><text x="800" y="33" text-anchor="end">HRIDAY VIG</text></g>
  <path d="M30 50H800" stroke="#e8e7df" stroke-opacity=".2"/>
  <text x="29" y="132" font-family="Arial,sans-serif" font-size="65" font-weight="400" letter-spacing="-5" fill="#e8e7df">Signal <tspan font-family="Georgia,serif" font-style="italic" fill="#ff4d35">Run.</tspan></text>
  <g font-family="Arial,sans-serif" font-size="14" fill="#b7c1a7"><text x="33" y="169">Move the receiver. Return the signal.</text><text x="33" y="192">Make room for clarity.</text></g>
  <g transform="translate(466 79)"><path d="M0 0H318V173H0Z" fill="#11150e" stroke="#73835a" stroke-opacity=".4"/>
    <g fill="#c8ff4d"><path d="M16 17h27v11H16zM49 17h27v11H49zM82 17h27v11H82zM115 17h27v11h-27zM148 17h27v11h-27zM181 17h27v11h-27zM214 17h27v11h-27zM247 17h27v11h-27zM280 17h22v11h-22z"/></g>
    <g fill="#91a867"><path d="M16 34h27v11H16zM49 34h27v11H49zM82 34h27v11H82zM115 34h27v11h-27zM148 34h27v11h-27zM181 34h27v11h-27zM247 34h27v11h-27zM280 34h22v11h-22z"/></g>
    <g fill="#586e3f"><path d="M16 51h27v11H16zM49 51h27v11H49zM82 51h27v11H82zM115 51h27v11h-27zM181 51h27v11h-27zM280 51h22v11h-22zM16 68h27v11H16zM49 68h27v11H49zM82 68h27v11H82zM115 68h27v11h-27zM280 68h22v11h-22z"/></g>
