<svg xmlns="http://www.w3.org/2000/svg" width="830" height="26" viewBox="0 0 830 26" role="img" aria-labelledby="t d"><title id="t">Section divider</title><desc id="d">An animated amber oscilloscope rail.</desc><style>:root{--bg:#FFFBF2;--surface:#FFF6E6;--ink:#241802;--muted:#7A5A1E;--grid:#F0DFBE;--accent:#FF8A00;--glow:#FFB000;}@media(prefers-color-scheme:dark){:root{--bg:#0B0906;--surface:#14100A;--ink:#FFE9BE;--muted:#B8925A;--grid:#3A2C12;--accent:#FFB000;--glow:#FFD37A;}}.rail{stroke:var(--grid);stroke-width:1;fill:none}.trace{stroke:var(--accent);stroke-width:1.6;fill:none;stroke-dasharray:6 10;animation:march 2.6s linear infinite}@keyframes march{to{stroke-dashoffset:-32}}.packet{animation:run 6.5s cubic-bezier(.45,0,.55,1) infinite}@keyframes run{0%{transform:translateX(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(830px);opacity:0}}</style><rect x="0" y="9" width="1" height="8" fill="var(--grid)"/><rect x="40" y="9" width="1" height="8" fill="var(--grid)"/><rect x="80" y="9" width="1" height="8" fill="var(--grid)"/><rect x="120" y="9" width="1" height="8" fill="var(--grid)"/><rect x="160" y="9" width="1" height="8" fill="var(--grid)"/><rect x="200" y="9" width="1" height="8" fill="var(--grid)"/><rect x="240" y="9" width="1" height="8" fill="var(--grid)"/><rect x="280" y="9" width="1" height="8" fill="var(--grid)"/><rect x="320" y="9" width="1" height="8" fill="var(--grid)"/><rect x="360" y="9" width="1" height="8" fill="var(--grid)"/><rect x="400" y="9" width="1" height="8" fill="var(--grid)"/><rect x="440" y="9" width="1" height="8" fill="var(--grid)"/><rect x="480" y="9" width="1" height="8" fill="var(--grid)"/><rect x="520" y="9" width="1" height="8" fill="var(--grid)"/><rect x="560" y="9" width="1" height="8" fill="var(--grid)"/><rect x="600" y="9" width="1" height="8" fill="var(--grid)"/><rect x="640" y="9" width="1" height="8" fill="var(--grid)"/><rect x="680" y="9" width="1" height="8" fill="var(--grid)"/><rect x="720" y="9" wid