<svg xmlns="http://www.w3.org/2000/svg" width="800" height="40" viewBox="0 0 800 40" role="img" aria-label="Animated indigo constellation divider">
<style>
:root { --line:#7C5CFC; --faint:#DDD7F2; }
@media (prefers-color-scheme:dark) { :root { --line:#A78BFA; --faint:#352D55; } }
.rail { stroke:var(--faint); stroke-width:1; } .star { fill:var(--line); } .drift { animation: drift 7s linear infinite; }
@keyframes drift { from { transform:translateX(-42px); } to { transform:translateX(42px); } }
