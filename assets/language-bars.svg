<svg xmlns="http://www.w3.org/2000/svg" width="405" height="214" viewBox="0 0 405 214" role="img" aria-labelledby="lt ld"><title id="lt">Language mix</title><desc id="ld">Share of code by language across public repositories, weighted by bytes.</desc><style>:root{--bg:#FFFBF2;--surface:#FFF6E6;--ink:#241802;--muted:#7A5A1E;--grid:#F0DFBE;--accent:#FF8A00;--glow:#FFB000;--scanInk:#7A5A1E;--scanOp:.06;--vig:.08;}@media(prefers-color-scheme:dark){:root{--bg:#0B0906;--surface:#14100A;--ink:#FFE9BE;--muted:#B8925A;--grid:#3A2C12;--accent:#FFB000;--glow:#FFD37A;--scanInk:#000000;--scanOp:.26;--vig:.38;}}.nm{fill:var(--ink);font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:11px;font-weight:600}.pc{fill:var(--muted);font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:10px}.hd{fill:var(--muted);font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:9px;letter-spacing:2px}.bar{transform-origin:left center;animation:grow 4s ease-out infinite}.b0{animation-delay:0.00s}.b1{animation-delay:0.11s}.b2{animation-delay:0.22s}.b3{animation-delay:0.33s}.b4{animation-delay:0.44s}.b5{animation-delay:0.55s}@keyframes grow{0%{transform:scaleX(0)}30%{transform:scaleX(1)}88%{transform:scaleX(1)}100%{transform:scaleX(1)}}</style><rect width="405" height="214" rx="14" fill="var(--bg)" stroke="var(--grid)"/><text class="hd" x="18" y="22">LANGUAGE MIX / BY BYTES</text><text class="nm" x="18" y="55">TypeScript</text><rect x="118" y="45" width="225" height="12" rx="6" fill="var(--grid)"/><rect class="bar b0" x="118" y="45" width="162.6" height="12" rx="6" fill="var(--accent)"/><text class="pc" x="387" y="55" text-anchor="end">72.3%</text><text class="nm" x="18" y="81">Python</text><rect x="118" y="71" width="225" height="12" rx="6" fill="var(--grid)"/><rect class="bar b1" x="118" y="71" width="59.7" height="12" rx="6" fill="var(--accent)"/><text class="pc" x="387" y="81" text-anchor="end">26.5%</text><text class="nm" x="18" y="107">JavaScript</text><rect x="118" y="97" width="225" height="12" rx="6" fill="var(--grid)"/><rect class="bar b2" x="118" y="97" width="2.4" height="12" rx="6" fill="var(--accent)"/><text class="pc" x="387" y="107" text-anchor="end">1.1%</text><text class="nm" x="18" y="133">HTML</text><rect x="118" y="123" width="225" height="12" rx="6" fill="var(--grid)"/><rect class="bar b3" x="118" y="123" width="0.2" height="12" rx="6" fill="var(--accent)"/><text class="pc" x="387" y="133" text-anchor="end">0.1%</text><text class="nm" x="18" y="159">Dockerfile</text><rect x="118" y="149" width="225" height="12" rx="6" fill="var(--grid)"/><rect class="bar b4" x="118" y="149" width="0.1" height="12" rx="6" fill="var(--accent)"/><text class="pc" x="387" y="159" text-anchor="end">0.0%</text><text class="nm" x="18" y="185">Jupyter Notebo</text><rect x="118" y="175" width="225" height="12" rx="6" fill="var(--grid)"/><rect class="bar b5" x="118" y="175" width="0.0" height="12" rx="6" fill="var(--accent)"/><text class="pc" x="387" y="185" text-anchor="end">0.0%</text></svg>
