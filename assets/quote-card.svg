<svg xmlns="http://www.w3.org/2000/svg" width="830" height="118" viewBox="0 0 830 118" role="img" aria-labelledby="qt qd"><title id="qt">Quote of the day</title><desc id="qd">The purpose of abstraction is not to be vague, but to create a new semantic level in which one can be absolutely precise.</desc><defs><pattern id="qscan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="var(--scanInk)" opacity="var(--scanOp)"/></pattern><radialGradient id="qvig" cx="50%" cy="50%" r="75%"><stop offset="52%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="var(--vig)"/></radialGradient><linearGradient id="qglowline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--accent)" stop-opacity="0"/><stop offset="50%" stop-color="var(--accent)" stop-opacity="1"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><style>:root{--bg:#FFFBF2;--surface:#FFF6E6;--ink:#241802;--muted:#7A5A1E;--grid:#F0DFBE;--accent:#FF8A00;--glow:#FFB000;--scanInk:#7A5A1E;--scanOp:.06;--vig:.08;}@media(prefers-color-scheme:dark){:root{--bg:#0B0906;--surface:#14100A;--ink:#FFE9BE;--muted:#B8925A;--grid:#3A2C12;--accent:#FFB000;--glow:#FFD37A;--scanInk:#000000;--scanOp:.30;--vig:.42;}}.q{fill:var(--ink);font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:14px}.by{fill:var(--muted);font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:10px;letter-spacing:1.6px}.mk{animation:mk 3.4s ease-in-out infinite}@keyframes mk{0%,100%{opacity:.9}50%{opacity:.35}}</style><rect width="830" height="118" rx="14" fill="var(--bg)" stroke="var(--grid)"/><text class="mk" x="30" y="56" fill="var(--accent)" font-family="Georgia, serif" font-size="52">&#8220;</text><text class="q" x="76" y="46">The purpose of abstraction is not to be vague, but to create a new</text><text class="q" x="76" y="68">semantic level in which one can be absolutely precise.</text><text class="by" x="76" y="98">REFRESHED DAILY BY refresh.yml</text><rect width="830" height="118" rx="14" fill="url(#qscan)"/></svg>
