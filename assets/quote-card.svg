<svg xmlns="http://www.w3.org/2000/svg" width="800" height="112" viewBox="0 0 800 112" role="img" aria-label="Programming quote of the day">
<style>:root{--bg:#F9F7FF;--ink:#21174A;--muted:#675E87;--accent:#7C5CFC;}@media(prefers-color-scheme:dark){:root{--bg:#0F0B1D;--ink:#EEEAFF;--muted:#BDB4DA;--accent:#A78BFA;}}.mark{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.4;transform:scale(.9)}}</style><rect width="800" height="112" rx="16" fill="var(--bg)"/><text class="mark" x="34" y="61" fill="var(--accent)" font-family="Georgia, serif" font-size="54">“</text><text x="82" y="48" fill="var(--ink)" font-family="Arial, sans-serif" font-size="18" font-weight="600">Verification turns</text><text x="82" y="74" fill="var(--ink)" font-family="Arial, sans-serif" font-size="18" font-weight="600">shipping into engineering.</text><text x="82" y="96" fill="var(--muted)" font-family="monospace" font-size="10">PROGRAMMING SIGNAL / REFRESHED DAILY</text></svg>
